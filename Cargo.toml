[workspace]
resolver = "2"
members = ["crates/core", "crates/provider-gdrive", "crates/provider-onedrive", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "stream", "form", "query"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
md-5 = "0.11"
sha2 = "0.11"
base64 = "0.22"
url = "2"
futures = "0.3"
bytes = "1"
notify = "9"
clap = { version = "4", features = ["derive"] }
directories = "6"
globset = "0.4"
tempfile = "3"
